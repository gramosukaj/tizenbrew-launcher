<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Accueil</title>
  <style>html, body { margin: 0; width: 1920px; height: 1080px; background: #06070A; }</style>
  <script>
    // Page de démarrage, servie par TizenBrew via jsDelivr. jsDelivr peut garder d'anciennes versions
    // en cache pendant des heures : le lanceur lui-même vient donc de GitHub Pages (à jour environ
    // une minute après un push), avec un repli sur les fichiers voisins si GitHub Pages ne répond pas.
    // La page garde l'origine de TizenBrew, ce qui lui laisse l'accès aux services locaux de la TV.
    const SOURCES = ['https://gramosukaj.github.io/tizenbrew-launcher/app/', new URL('./', location.href).href];

    function load(base) {
      const get = file => fetch(base + file, { cache: 'no-store' })
        .then(res => { if (!res.ok) throw new Error(file + ' ' + res.status); return res.text(); });
      return Promise.all(['launcher.html', 'config.js', 'launcher.js'].map(get)).then(([html, config, script]) => html
        .replace('<head>', `<head><base href="${base}">`)
        .replace('<script src="config.js"><\/script>', () => `<script>${config}<\/script>`)
        .replace('<script src="launcher.js"><\/script>', () => `<script>${script}<\/script>`));
    }

    load(SOURCES[0]).catch(() => load(SOURCES[1])).then(html => {
      document.open();
      document.write(html);
      document.close();
    }).catch(() => {
      document.body.style.cssText = 'color:#F4F5F8;font:32px system-ui,sans-serif;display:flex;align-items:center;justify-content:center';
      document.body.textContent = 'Impossible de charger le lanceur. Vérifie la connexion internet puis relance TizenBrew.';
    });
  </script>
</head>
<body></body>
</html>
