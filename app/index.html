<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Accueil</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    body {
      background: #0B0D12;
      color: #E8EAF0;
      font-family: "SamsungOneUI", "SamsungOne", "Helvetica Neue", Arial, sans-serif;
    }
    #page { height: 100%; overflow: hidden; padding: 44px 96px 0; }

    header { display: flex; align-items: baseline; gap: 32px; margin-bottom: 24px; }
    #clock { font-size: 80px; font-weight: 300; letter-spacing: -2px; }
    #date { font-size: 32px; color: #9AA0AE; }

    .row { margin-bottom: 28px; }
    .row h2 { font-size: 26px; font-weight: 500; color: #9AA0AE; margin-bottom: 12px; }
    .tiles { display: flex; gap: 24px; overflow: hidden; padding: 10px 12px; margin: -10px -12px; }

    .tile {
      flex: 0 0 auto;
      width: 240px; height: 135px;
      border-radius: 18px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 700;
      text-align: center; padding: 0 14px;
      outline: 4px solid transparent;
      transition: transform 120ms ease-out;
    }
    .tile small { font-size: 20px; font-weight: 400; opacity: 0.8; margin-top: 4px; }
    .tile.focus { transform: scale(1.08); outline-color: #FFFFFF; }

    #hint {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 18px 96px;
      font-size: 22px; color: #6B7280;
      background: #0B0D12;
    }
    #toast {
      position: fixed; left: 50%; bottom: 80px;
      transform: translateX(-50%);
      padding: 16px 32px; border-radius: 12px;
      background: #2A2F3A; font-size: 26px;
      display: none;
    }
    #toast.show { display: block; }
  </style>
</head>
<body>
  <div id="page">
    <header>
      <div id="clock"></div>
      <div id="date"></div>
    </header>
    <main id="rows"></main>
  </div>
  <div id="hint">OK : ouvrir · Retour : quitter · Menu TizenBrew : appuie sur ↑ pendant que TizenBrew démarre</div>
  <div id="toast"></div>
  <script src="config.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
