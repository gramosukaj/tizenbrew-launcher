<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Accueil</title>
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/files/inter-latin-wght-normal.woff2">
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/files/inter-latin-wght-normal.woff2') format('woff2');
    }

    :root {
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --side: 96px;
      --text: #F4F5F8;
      --muted: rgba(244, 245, 248, 0.6);
      --faint: rgba(244, 245, 248, 0.38);
      --glass: rgba(255, 255, 255, 0.07);
      --glass-line: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #06070A; }
    body {
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }
    img, svg { display: block; }

    /* --- Lumière d'ambiance : deux canvas en fondu enchaîné ---
       Dessinés en 192×108 et étirés à l'écran : un dégradé reste doux une fois agrandi,
       et la TV n'a presque rien à recalculer quand la couleur change. */
    .ambient { position: fixed; inset: 0; pointer-events: none; }
    .ambient-layer {
      position: absolute; inset: 0; width: 1920px; height: 1080px;
      opacity: 0;
      transition: opacity 900ms var(--ease-in-out);
      will-change: opacity;
    }
    .ambient-layer.on { opacity: 1; }
    .vignette {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(1500px 1000px at 50% 45%, transparent 45%, rgba(0, 0, 0, 0.6) 100%);
    }

    /* --- Deux écrans empilés : l'accueil puis toutes les applis --- */
    .stage { position: fixed; left: 0; top: 0; width: 1920px; transition: transform 760ms var(--ease-out); will-change: transform; }
    .stage.library-open { transform: translateY(-1080px); }
    .screen { position: relative; width: 1920px; height: 1080px; }

    /* --- Accueil : heure, météo, raccourcis --- */
    .clock-block { position: absolute; top: 76px; left: var(--side); }
    .greeting { font-size: 30px; font-weight: 600; color: rgba(244, 245, 248, 0.82); }
    .time {
      font-size: 156px; font-weight: 600; letter-spacing: -0.05em; line-height: 1; margin: 6px 0 10px -6px;
      font-feature-settings: 'tnum' 1;
    }
    .date { font-size: 32px; font-weight: 600; }
    .weather { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 28px; font-weight: 500; color: var(--muted); }
    .weather svg { width: 38px; height: 38px; }

    .actions { position: absolute; top: 76px; right: var(--side); display: flex; gap: 16px; }
    .pill {
      display: flex; align-items: center; gap: 12px;
      height: 60px; padding: 0 26px; border-radius: 999px;
      font-size: 22px; font-weight: 600;
      background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-line);
      transition: transform 280ms var(--ease-out), background-color 200ms, color 200ms;
    }
    .pill svg { width: 26px; height: 26px; }
    .pill.focus { background: #F4F5F8; color: #0B0C10; transform: scale(1.08); }

    /* --- Rail des favoris --- */
    .spotlight {
      position: absolute; left: 0; right: 0; top: 640px; text-align: center;
    }
    .spotlight-name { font-size: 40px; font-weight: 750; letter-spacing: -0.03em; }
    .spotlight-tagline { font-size: 24px; font-weight: 450; color: var(--muted); margin-top: 8px; }
    .dock {
      position: absolute; left: 50%; bottom: 126px; transform: translateX(-50%);
      display: flex; gap: 22px; padding: 22px; border-radius: 38px;
      background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-line), 0 30px 80px rgba(0, 0, 0, 0.45);
    }
    .dock .tile { width: 216px; height: 122px; }
    .dock-empty { font-size: 24px; color: var(--muted); padding: 40px 60px; }
    .scroll-hint {
      position: absolute; left: 0; right: 0; bottom: 44px;
      display: flex; justify-content: center; align-items: center; gap: 10px;
      font-size: 20px; font-weight: 550; color: var(--faint);
    }
    .scroll-hint svg { width: 22px; height: 22px; }

    /* --- Cartes (rail, rangées, panneau) --- */
    .tile { position: relative; flex: 0 0 auto; transition: transform 340ms var(--ease-out); }
    .tile::before {
      content: ''; position: absolute; inset: 12% 4% -4%;
      border-radius: 24px; box-shadow: 0 20px 34px rgba(0, 0, 0, 0.7);
      opacity: 0; transition: opacity 340ms var(--ease-out);
    }
    .card { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07); }
    .ring {
      position: absolute; inset: -7px; border-radius: 25px;
      box-shadow: 0 0 0 4px #FFFFFF;
      opacity: 0; transform: scale(0.97);
      transition: opacity 240ms var(--ease-out), transform 340ms var(--ease-out);
    }
    .tile.focus { transform: scale(1.14); z-index: 2; }
    .tile.focus::before { opacity: 1; }
    .tile.focus .ring { opacity: 1; transform: none; }
    .tile.pressed { transform: scale(1.05); transition-duration: 160ms; }
    .fav-mark {
      position: absolute; top: 9px; right: 9px; width: 26px; height: 26px; border-radius: 50%;
      background: rgba(0, 0, 0, 0.45); display: flex; align-items: center; justify-content: center;
    }
    .fav-mark svg { width: 15px; height: 15px; }

    .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    /* Reflet par-dessus le logo : uniforme même quand l'icône a son propre fond. */
    .face::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0) 42%);
    }
    .face img { position: relative; max-width: 62%; max-height: 42%; object-fit: contain; }
    .face img.white { filter: brightness(0) invert(1); }
    .face .monogram { position: relative; font-size: 36px; font-weight: 750; letter-spacing: -0.03em; }
    .face .badge {
      position: absolute; right: 12px; bottom: 10px;
      font-size: 14px; font-weight: 700; letter-spacing: 0.06em;
      padding: 3px 9px; border-radius: 7px;
      background: rgba(0, 0, 0, 0.35); color: #fff;
    }

    /* --- Toutes les applis --- */
    .library-head { position: absolute; top: 84px; left: var(--side); right: var(--side); }
    .library-kicker { font-size: 20px; font-weight: 650; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    .library-title { font-size: 64px; font-weight: 750; letter-spacing: -0.035em; line-height: 1; margin-top: 16px; }
    .library-tagline { font-size: 26px; color: var(--muted); margin-top: 14px; }
    .shelf { position: absolute; top: 330px; left: 0; right: 0; bottom: 0; }
    .rows { transition: transform 520ms var(--ease-out); will-change: transform; }
    .row { padding: 0 var(--side); height: 262px; transition: opacity 420ms var(--ease-in-out); will-change: opacity; }
    .row.above { opacity: 0; }
    .row.below { opacity: 0.4; }
    .row-title { font-size: 25px; font-weight: 650; margin-bottom: 26px; color: var(--muted); }
    .row.current .row-title { color: var(--text); }
    .track { display: flex; gap: 30px; transition: transform 480ms var(--ease-out); will-change: transform; }
    .track .tile { width: 300px; height: 169px; }
    .fade-bottom {
      position: absolute; left: 0; right: 0; bottom: 0; height: 190px; pointer-events: none;
      background: linear-gradient(180deg, rgba(6, 7, 10, 0) 0%, rgba(6, 7, 10, 0.85) 70%, #06070A 100%);
    }

    /* --- Panneau « épingler sur l'accueil » --- */
    .overlay {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(4, 5, 8, 0.78);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 280ms var(--ease-in-out);
      will-change: opacity;
    }
    .overlay.on { opacity: 1; }
    .panel {
      width: 1660px; padding: 56px 64px 48px; border-radius: 40px;
      background: #121419; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      transform: translateY(24px) scale(0.98); transition: transform 420ms var(--ease-out);
    }
    .overlay.on .panel { transform: none; }
    .panel-title { font-size: 40px; font-weight: 750; letter-spacing: -0.03em; }
    .panel-subtitle { font-size: 24px; color: var(--muted); margin-top: 10px; }
    .slots { display: flex; justify-content: center; gap: 18px; margin: 54px 0 46px; height: 160px; }
    .slot { display: flex; flex-direction: column; align-items: center; gap: 16px; transition: opacity 260ms; }
    .slot .tile { width: 168px; height: 95px; }
    .slot-number { font-size: 19px; font-weight: 650; color: var(--faint); }
    .slot.candidate .slot-number { color: var(--text); }
    .slot.other { opacity: 0.5; }
    .slot.dropped { opacity: 0.18; }
    .panel-actions { display: flex; justify-content: space-between; align-items: center; }
    .panel-keys { display: flex; gap: 14px; font-size: 21px; font-weight: 550; color: var(--muted); }
    .panel-keys span { display: flex; align-items: center; gap: 10px; }
    .key {
      font-size: 14px; font-weight: 750; letter-spacing: 0.04em;
      padding: 4px 9px; border-radius: 7px; background: rgba(255, 255, 255, 0.14); color: var(--text);
    }
    .panel-remove { opacity: 1; }
    .panel-remove.hidden { visibility: hidden; }

    /* --- Apparition au démarrage --- */
    .intro .clock-block, .intro .actions, .intro .spotlight, .intro .dock, .intro .scroll-hint { opacity: 0; }
    .boot .clock-block, .boot .actions, .boot .spotlight, .boot .dock, .boot .scroll-hint { animation: rise 1000ms var(--ease-out) both; }
    .boot .actions { animation-delay: 80ms; }
    .boot .spotlight { animation-delay: 200ms; }
    .boot .dock { animation-name: rise-dock; animation-delay: 260ms; }
    .boot .scroll-hint { animation-delay: 420ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(26px); } }
    @keyframes rise-dock { from { opacity: 0; transform: translate(-50%, 40px); } }

    /* --- Écran de lancement --- */
    .splash { position: fixed; inset: 0; z-index: 30; opacity: 0; pointer-events: none; transition: opacity 280ms var(--ease-in-out); }
    .splash.on { opacity: 1; }
    .splash .face img { max-width: 36%; max-height: 22%; transform: scale(0.94); transition: transform 900ms var(--ease-out); }
    .splash.on .face img { transform: none; }

    .toast {
      position: fixed; left: 50%; bottom: 70px; z-index: 31;
      padding: 16px 30px; border-radius: 16px;
      background: rgba(30, 32, 40, 0.96); font-size: 24px; font-weight: 550;
      opacity: 0; transform: translate(-50%, 12px);
      transition: opacity 260ms var(--ease-out), transform 260ms var(--ease-out);
    }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body class="intro">
  <div class="ambient">
    <canvas class="ambient-layer" width="192" height="108"></canvas>
    <canvas class="ambient-layer" width="192" height="108"></canvas>
  </div>
  <div class="vignette"></div>

  <div class="stage" id="stage">
    <section class="screen" id="home">
      <div class="clock-block">
        <div class="greeting" id="greeting"></div>
        <div class="time" id="time"></div>
        <div class="date" id="date"></div>
        <div class="weather" id="weather"></div>
      </div>
      <div class="actions" id="actions"></div>
      <div class="spotlight" id="spotlight">
        <div class="spotlight-name" id="spotlight-name"></div>
        <div class="spotlight-tagline" id="spotlight-tagline"></div>
      </div>
      <div class="dock" id="dock"></div>
      <div class="scroll-hint" id="scroll-hint"></div>
    </section>

    <section class="screen" id="library">
      <div class="library-head" id="library-head">
        <div class="library-kicker" id="library-kicker"></div>
        <div class="library-title" id="library-title"></div>
        <div class="library-tagline" id="library-tagline"></div>
      </div>
      <div class="shelf"><div class="rows" id="rows"></div></div>
      <div class="fade-bottom"></div>
    </section>
  </div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <div class="panel-title" id="panel-title"></div>
      <div class="panel-subtitle" id="panel-subtitle"></div>
      <div class="slots" id="slots"></div>
      <div class="panel-actions">
        <div class="panel-keys" id="panel-keys"></div>
        <div class="pill panel-remove" id="panel-remove"></div>
      </div>
    </div>
  </div>

  <div class="splash" id="splash"></div>
  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
